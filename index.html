<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Position size and lot size engine for traders">
  <title>SizeEngine</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Initial Setup Modal -->
<div class="modal-overlay" id="modeModal">
  <div class="modal-card">
    <h3>Select Engine Mode</h3>
    <p>Choose your target execution environment to configure calculation rules.</p>
    <div class="modal-options">
      <button class="modal-btn" onclick="selectInitialMode('LOT')">
        <span class="btn-title">Lot Mode</span>
        <span class="btn-sub">(MT5)</span>
      </button>
      <button class="modal-btn" onclick="selectInitialMode('LEVERAGE')">
        <span class="btn-title">Leverage Mode</span>
        <span class="btn-sub">(Crypto Ex)</span>
      </button>
    </div>
  </div>
</div>

<main class="calculator">
  <h2>SizeEngine</h2>

  <!-- Custom Popup-Style Mode Switcher -->
  <section class="engine-switch-container">
    <button class="switch-tab active" id="lotTab" onclick="switchEngineMode('LOT')">Lot Mode (MT5)</button>
    <button class="switch-tab" id="levTab" onclick="switchEngineMode('LEVERAGE')">Leverage Mode (Crypto Ex)</button>
  </section>

  <!-- Long/Short Toggle -->
  <section class="toggle-container">
    <button class="toggle-btn active long" id="longBtn" onclick="setDirection('LONG')">LONG</button>
    <button class="toggle-btn" id="shortBtn" onclick="setDirection('SHORT')">SHORT</button>
  </section>

  <section class="form-group">
    <label for="accountSize">Account Balance ($)</label>
    <input type="text" id="accountSize" placeholder="e.g. 10" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off">
  </section>
  
  <section class="form-group">
    <label for="riskAmount">Cash Amount to Risk ($)</label>
    <input type="text" id="riskAmount" placeholder="e.g. 2" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off">
  </section>
  
  <section class="form-group">
    <label for="rrRatio">Risk to Reward Ratio (1 : X)</label>
    <input type="text" id="rrRatio" placeholder="e.g. 3" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off">
  </section>
  
  <section class="form-group">
    <label for="entryPrice">Entry Price ($)</label>
    <input type="text" id="entryPrice" placeholder="e.g. 41,200" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off">
  </section>
  
  <section class="form-group">
    <label for="stopLoss">Stop Loss Price ($)</label>
    <input type="text" id="stopLoss" placeholder="e.g. 41,100" inputmode="decimal" autocapitalize="off" autocomplete="off" autocorrect="off">
  </section>

  <!-- Simplified Results Section -->
  <section class="results" id="resultsContainer">
    <!-- Populated via JS -->
  </section>
</main>

<script src="main.js"></script>
<script src="register_sw.js"></script>

</body>
</html>
